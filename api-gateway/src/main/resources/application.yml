server:
  port: ${GATEWAY_PORT:8085}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-oauth2
          uri: lb://user-service
          predicates:
            - Path=/oauth2/**, /login/oauth2/**
        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/internal/**
        - id: complaint-service
          uri: lb://complaint-service
          predicates:
            - Path=/api/v1/complaints/**, /api/v1/categories/**
        - id: notification-service-rest
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: notification-service-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always

---
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
      port: 6379

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka/
